    <form id="contact-form" class="show">

    <label for="imageurl">Image URL</label>
    <input   type="url" id="imageurl" placeholder="Enter image URL" required>

    <label for="fullname">Full Name</label>
    <input type="text" id="fullname" placeholder="Enter full name" required>

    <label for="hometown">Hometown</label>
    <input type="text" id="hometown" placeholder="Enter hometown" required>

    <label for="purpose">Purpose</label>
    <input type="text" id="purpose" placeholder="Enter purpose" required>

    <p>Priority</p>

    <label class="radio-option">
        <input type="radio" name="priority" value="Emergency">
        Emergency
    </label>

    <label class="radio-option">
        <input type="radio" name="priority" value="No Rush">
        No Rush
    </label>

    <label class="radio-option">
        <input type="radio" name="priority" value="Urgent">
        Urgent
    </label>

    <label class="radio-option">
        <input type="radio" name="priority" value="Important">
        Important
    </label>

    <div class="form-buttons">
        <button type="submit" id="create-note">Create Note</button>
        <button type="button" id="close-form">Close</button>
    </div>

</form>
